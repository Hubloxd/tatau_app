<main
  id="main-content"
  tabindex="-1"
  class="mx-auto max-w-lg px-4 py-16 text-center sm:px-6"
>
  @if (page().showRegisteredOk) {
    <div
      class="mb-6 rounded-lg border border-border bg-card px-4 py-3 text-sm text-foreground shadow-sm"
      role="status"
    >
      <strong class="text-accent">Konto utworzone.</strong>
      Gdy logowanie będzie dostępne, zaloguj się tutaj. Na razie możesz wrócić
      na stronę główną.
    </div>
  }
  <h1 class="text-2xl font-semibold tracking-tight text-foreground">
    {{ page().title }}
  </h1>
  <p class="mt-4 text-muted">{{ page().body }}</p>
  <a routerLink="/" class="btn-primary mt-8 inline-flex">
    Powrót do strony głównej
  </a>
</main>
