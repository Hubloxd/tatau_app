services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tatau
      POSTGRES_PASSWORD: tatau
      POSTGRES_DB: tatau
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tatau -d tatau"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    depends_on:
      - db

  backend:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://tatau:tatau@db:5432/tatau
      POSTGRES_SSLMODE: disable
      STORAGE_MODE: local
      PUBLIC_BASE_URL: http://localhost:8000
      LOCAL_UPLOAD_DIR: /app/uploads
    volumes:
      - ./uploads:/app/uploads
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "4200:4200"

volumes:
  pgdata:
